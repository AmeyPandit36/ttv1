version: '3.8'

services:
  app:
    build: .
    ports:
      - "4000:4000"
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/chronos?schema=public
      - JWT_SECRET=production-change-me-to-a-very-strong-key-512bit
      - PORT=4000
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=chronos
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
